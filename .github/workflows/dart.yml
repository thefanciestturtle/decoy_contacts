name: Flutter CI

# Branches are built through their pull request; push only builds master, so
# each change to a PR branch is built once.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9
  GRADLE_CACHE_PATHS: |
    ~/.gradle/caches
    ~/.gradle/wrapper

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      # The Gradle distribution and the Kotlin compiler are downloaded from
      # GitHub releases, which sometimes time out (HTTP 504). Restoring them
      # from the cache avoids that, and speeds up the build. Both jobs share
      # one cache, which only the on-device job saves, and only on master:
      # it is about 2 GB, the repo gets 10 GB, and a cache saved by a PR can
      # only be used by that PR. A change to the Gradle files, the Flutter
      # version or pubspec.lock makes a new entry.
      - &restore-gradle-cache
        name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_CACHE_PATHS }}
          key: gradle-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          # The last line falls back to the per-job cache used before this
          # shared one, until that has been deleted (then it matches nothing).
          restore-keys: |
            gradle-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-
            gradle-integration-test-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

  # Create and Delete against the real Android contacts provider, on an
  # emulator. API 36 matches the app's target SDK and the local test AVD.
  integration-test:
    name: On-device tests (Android emulator, API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      # Same step as in the build job (a YAML alias), so the key can't drift.
      - *restore-gradle-cache

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      # Build before the emulator starts, so the two don't compete for the
      # CPU. The test script's own build is then mostly up to date.
      - name: Build debug APK
        run: flutter build apk --debug

      # For the release smoke test, built before the emulator starts like the
      # debug APK (the test's own build is then up to date). Only for the
      # emulator's ABI: R8, which is what can break release builds, runs the
      # same way for every ABI.
      - name: Build release APK (x86_64)
        run: flutter build apk --release --target-platform android-x64

      # On master only (see "Restore Gradle cache"), save the Gradle cache
      # once both builds have worked, before the emulator starts. Stop Gradle
      # first, so nothing is written to the cache while it is being saved,
      # and drop its lock files.
      - name: Stop Gradle
        if: github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true'
        run: |
          if [ -x android/gradlew ]; then (cd android && ./gradlew --stop); fi
          find ~/.gradle/caches -name '*.lock' -delete
          rm -f ~/.gradle/caches/*/gc.properties

      - name: Save Gradle cache
        if: github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_CACHE_PATHS }}
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on-device tests and release smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            tool/integration_test.sh --wipe-contacts
            tool/release_smoke_test.sh
