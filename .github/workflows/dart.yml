name: Flutter CI

# Branches are built through their pull request; push only builds master, so
# each change to a PR branch is built once.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.0
  # The JDK that runs the build, an LTS release. (The app's own Java/Kotlin
  # level is set in android/app/build.gradle.kts. On the phone the app runs
  # on Android's runtime, not on this JDK.)
  JAVA_VERSION: "25"
  GRADLE_CACHE_PATHS: |
    ~/.gradle/caches
    ~/.gradle/wrapper

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The Gradle distribution and the Kotlin compiler are downloaded from
      # GitHub releases, which sometimes time out (HTTP 504). Restoring them
      # from the cache avoids that, and speeds up the build. The build job and
      # the on-device jobs share one cache, which only the on-device jobs
      # save, and only on master: it is about 2 GB, the repo gets 10 GB, and
      # a cache saved by a PR can only be used by that PR. A change to the
      # Gradle files, the Flutter or JDK version or pubspec.lock makes a new
      # entry.
      - &restore-gradle-cache
        name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_CACHE_PATHS }}
          key: gradle-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-jdk-${{ env.JAVA_VERSION }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-jdk-${{ env.JAVA_VERSION }}-

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

  # Gradle, the Android Gradle plugin and Kotlin on the versions of this
  # Flutter's project template, and the same gradle.properties; and the
  # tests of the scripts that check this and Flutter's releases. A job of
  # its own, where nothing is built: a build adds missing flags to
  # gradle.properties by itself, so the check would miss them.
  build-tools:
    name: Build tools match Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Check the build tools against Flutter's template
        run: tool/check_build_tools.sh

      - name: Test tool/check_build_tools.sh
        if: ${{ !cancelled() }}
        run: tool/test/check_build_tools_test.sh

      - name: Test tool/check_flutter_release.sh
        if: ${{ !cancelled() }}
        run: tool/test/check_flutter_release_test.sh

  # The release APK, built by tool/build_release.sh as it is built for a
  # release and as F-Droid will build it: twice, from fresh clones, and the
  # two must be the same file. F-Droid publishes the signed APK only if its
  # own build of the same commit is that APK too. Also the tests of the
  # release scripts.
  release-build:
    name: Release build is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Same step as in the build job (a YAML alias). The sandbox uses this
      # ~/.gradle as its own.
      - *restore-gradle-cache

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The build's sandbox. Ubuntu 24.04 and newer stop programs without
      # their own AppArmor profile from making user namespaces, which
      # bubblewrap needs.
      - name: Install bubblewrap
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends bubblewrap
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Test the release scripts
        run: tool/test/release_test.sh

      # With this job's Flutter (an unpacked release archive, which is on
      # the stable branch; the version is checked) and Gradle cache. The
      # second build finds the first one's APK in dist/, and stops unless it
      # is the same file; the APK there must not change either.
      - name: Build the release APK twice
        run: |
          flutter_sdk="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          tool/build_release.sh --flutter-sdk "$flutter_sdk" --gradle-home ~/.gradle
          first="$(sha256sum dist/*-unsigned.apk)"
          tool/build_release.sh --flutter-sdk "$flutter_sdk" --gradle-home ~/.gradle
          [ "$(sha256sum dist/*-unsigned.apk)" = "$first" ]

  # Create and Delete against the real Android contacts provider, on an
  # emulator: API 36, the app's target SDK; and Android 17 (API 37.0), which
  # phones already run, whatever the app targets. (Android 17 also limits
  # each app's memory, but not on the emulator, which has no limits set.
  # Measured by hand on a 4 GB one: at most 266 MiB with 20,000 fake
  # contacts, against at least 1024 MiB allowed on a 4 GB phone.)
  integration-test:
    name: On-device tests (Android emulator, API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # (A failure on one doesn't stop the other.)
      fail-fast: false
      matrix:
        # (Strings: "37.0" is part of the names of the platform and the
        # system image.)
        api-level: [ "36", "37.0" ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Same step as in the build job (a YAML alias), so the key can't drift.
      - *restore-gradle-cache

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      # Build before the emulator starts, so the two don't compete for the
      # CPU. The test script's own build is then mostly up to date.
      - name: Build debug APK
        run: flutter build apk --debug

      # For the release smoke test, built before the emulator starts like the
      # debug APK (the test's own build is then up to date). Only for the
      # emulator's ABI: R8, which is what can break release builds, runs the
      # same way for every ABI. (Unsigned, as release builds are; the smoke
      # test signs a copy with the debug key, which the debug build made.)
      - name: Build release APK (x86_64)
        run: flutter build apk --release --target-platform android-x64

      # On master only (see "Restore Gradle cache"), save the Gradle cache
      # once this job's debug and release builds have worked, before the
      # emulator starts. Both on-device jobs try: whichever comes second
      # finds the entry taken, and only says so. Stop Gradle first, so
      # nothing is written to the cache while it is being saved, and drop
      # its lock files. (Not on other runs: the test script's first build
      # would start it again, and slower.)
      - name: Stop Gradle
        if: github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true'
        run: |
          if [ -x android/gradlew ]; then (cd android && ./gradlew --stop); fi
          find ~/.gradle/caches -name '*.lock' -delete
          rm -f ~/.gradle/caches/*/gc.properties

      - name: Save Gradle cache
        if: github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GRADLE_CACHE_PATHS }}
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on-device tests and release smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          # (The script's first line checks this AVD; this shows its target
          # before the emulator starts, also if it then doesn't boot.)
          avd-name: test
          pre-emulator-launch-script: grep -H '^target=' "$ANDROID_AVD_HOME/test.ini"
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          # First, the AVD must be for that API level: older avdmanagers
          # (command-line tools 12) wrote "android-0" for one like 37.0, and
          # the emulator then ran it as a very old one. A failing line stops
          # the rest.
          script: |
            target="$(sed -n 's/^target=//p' "$ANDROID_AVD_HOME/test.ini")"; [ "$target" = 'android-${{ matrix.api-level }}' ] || { echo "::error::The AVD's target is '${target:-none}' in $ANDROID_AVD_HOME/test.ini, not android-${{ matrix.api-level }}: is avdmanager too old?"; exit 1; }
            tool/integration_test.sh --wipe-contacts
            tool/release_smoke_test.sh
