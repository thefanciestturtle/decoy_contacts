name: Flutter release check

# Once a week: is a newer stable Flutter out than the one CI builds with
# (FLUTTER_VERSION in dart.yml)? If so, tool/check_flutter_release.sh keeps
# one issue open saying so; it closes the issue once FLUTTER_VERSION has
# caught up. Can also be started by hand (Actions tab).
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The only job here that may write: it opens, edits and closes that
    # issue.
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare with Flutter's current stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tool/check_flutter_release.sh
