# Dependabot opens pull requests that update the GitHub Actions (pinned to
# commit SHAs in the workflows, with the exact version in a comment) and the
# direct pub dependencies. CI then builds and tests each update.
#
# Not covered, so update these by hand now and then:
# - Flutter itself (the version set in .github/workflows/dart.yml).
# - Gradle, the Android Gradle plugin and Kotlin. Their versions have to match
#   what the Flutter version supports, so update them together with Flutter.
#   A new Gradle version also needs its checksum (distributionSha256Sum in
#   android/gradle/wrapper/gradle-wrapper.properties).
# - The JDK that runs the build (also set in .github/workflows/dart.yml).
# - Transitive pub packages (`flutter pub upgrade`).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a bad or
    # compromised release has time to be noticed and pulled.
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pub-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
